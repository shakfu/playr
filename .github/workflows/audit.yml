# Checks Cargo.lock against the RustSec advisory database: weekly, since an
# advisory can appear for a crate nobody changed, and whenever the lock or a
# manifest changes. It fails on a vulnerability; unmaintained and yanked
# crates are reported as warnings, as `cargo audit` does by default.
name: audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
