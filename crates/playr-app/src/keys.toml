# playr's default theme and key bindings, which both frontends read from
# settings.toml.
#
# The rest of the defaults are in crates/playr-core/src/settings.toml. The
# format is described in README.md, under Configuration.

# system, light or dark.
theme = "dark"

# Keys for every view. Each value is a : command; "nop" makes a key do nothing.
[keys]
q = "quit"
"?" = "keys"
":" = "command"
tab = "next-view"
1 = "view library"
2 = "view selection"
3 = "view playlists"
4 = "view sampler"
j = "down"
down = "down"
shift-down = "down"
k = "up"
up = "up"
shift-up = "up"
pagedown = "down 10"
pageup = "up 10"
g = "first"
home = "first"
G = "last"
end = "last"
enter = "play"
"/" = "search"
s = "save"
space = "pause"
n = "next"
p = "prev"
x = "stop"
right = "seek +5"
left = "seek -5"
shift-right = "seek +30"
shift-left = "seek -30"
"+" = "volume +5"
"=" = "volume +5"
"-" = "volume -5"
_ = "volume -5"
"]" = "speed +1"
"[" = "speed -1"
'\' = "speed 0"
m = "mode +"
M = "mode -"
b = "mark"
B = "unmark"
C = "delmarks"
"." = "next-mark"
"," = "prev-mark"

# Keys for one view, which win there over the keys above.
[keys.library]
a = "toggle"
esc = "clear-search"

[keys.selection]
d = "remove"
J = "move +1"
K = "move -1"
shift-down = "move +1"
shift-up = "move -1"
c = "clear"

[keys.playlists]
a = "add"
d = "delete"
r = "rename"

[keys.sampler]
z = "zoom +"
Z = "zoom -"
0 = "zoom all"
w = "display"
enter = "write"
esc = "discard"
