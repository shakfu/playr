# playr's default settings.
#
# ~/.config/playr/settings.toml is read on top of these, so it only needs the
# lines it changes. The format is described in README.md, under Configuration.
# The theme and key bindings are in crates/playr-app/src/keys.toml.

# Percent, 0 to 100.
volume = 100
# normal, shuffle, repeat or repeat-one.
mode = "normal"
# Semitones, -12 to 12.
speed = 0
# How readily :slice onsets finds hits, 0 to 1; higher finds more.
onset_sensitivity = 0.5
# Where :slice writes, one directory per slicing. ~ is your home. On Windows,
# write 'C:\Music' in single quotes, or "C:/Music": in "...", \ is an escape.
samples = "~/Music/playr/samples"
# What :slice does at each slice's edges, against clicks: exact cuts where the
# edge falls; zero moves it to the nearest zero crossing within 10 ms; fade
# fades each slice in and out, so it is no longer an exact copy.
slice_edges = "exact"
# The fades slice_edges = "fade" uses, in milliseconds, 0 to 100, each at most
# half the slice. Short in, to keep a hit's attack.
slice_fade_in = 1
slice_fade_out = 5
# After a scan, remove tracks whose files are gone, without asking.
auto_prune = false
# After a scan, analyse what it added or found changed, in the background.
# Without it, gains and tempos wait for `playr analyze` or `:analyze`.
analyze_on_scan = false
# The output device, as `playr devices` lists it; "" is the default device.
device = ""
# Level tracks by loudness: off, track, album or auto. auto uses album gain in
# normal and repeat modes, track gain in shuffle and repeat-one. Gains come from
# `playr analyze`, else from the files' tags; files are never changed.
replaygain = "off"
# The columns a track list shows, in order: title, artist, album_artist,
# album, disc, track, year, time, tempo, loudness, peak or path. tempo,
# loudness and peak come from `playr analyze`. A [terminal], [gui] or
# [server] table may name its own list.
columns = ["artist", "album", "title", "time"]
# The keys the library is sorted by, most important first; add `desc` to a
# name to reverse it. Tracks with nothing to sort on come last either way.
sort = ["album_artist", "album", "disc", "track", "title"]

# The window has room for the title first, and the page's columns are fixed
# for now. A program's table wins over the keys above.
[gui]
columns = ["title", "artist", "album", "time"]
# The transport's buttons as words, such as Prev and Play, not symbols.
transport_text_buttons = false
