[package]
name = "playr-gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
# egui and eframe 0.36 need 1.95; the rest of the workspace builds on 1.89.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A desktop window for playr, with the terminal interface's features"
keywords = ["music", "audio", "player", "gui"]
categories = ["multimedia::audio"]
# Not published until it has the terminal's features; see docs/dev/gui.md.
publish = false

[features]
default = ["opus"]
# Opus decoding via libopus, as in the terminal build; see the playr crate.
opus = ["playr-core/opus"]

[dependencies]
playr-core.workspace = true
playr-app.workspace = true
playr-dsp.workspace = true
playr-looper.workspace = true
eframe = "0.36.2"
egui_extras = "0.36.2"
clap = { version = "4.6", features = ["derive"] }
rusqlite.workspace = true
rfd = "0.17"
# The window's HWND, for the Windows now-playing panel; the version eframe uses.
raw-window-handle = "0.6.2"
# Font coverage, for the system fonts in `fonts.rs`; the version epaint uses.
skrifa = "0.44.0"

[dev-dependencies]
cpal.workspace = true
egui_kittest = { version = "0.36.2", features = ["eframe"] }
hound.workspace = true
rtrb.workspace = true
tempfile.workspace = true

[build-dependencies]
embed-resource = "3"
