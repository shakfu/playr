[workspace]
members = ["crates/playr-core", "crates/playr-app", "crates/playr-gui"]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/shakfu/playr"
homepage = "https://github.com/shakfu/playr"

# Versions shared by more than one crate, so the crates cannot drift apart.
[workspace.dependencies]
playr-core = { path = "crates/playr-core", version = "0.5.1" }
playr-app = { path = "crates/playr-app", version = "0.5.1" }
cpal = "0.18.2"
hound = "3.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
rtrb = "0.4.0"
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["parse", "preserve_order"] }

[package]
name = "playr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A minimal TUI music player that plays local files and contacts nothing"
readme = "README.md"
keywords = ["music", "player", "tui", "audio", "flac"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = ["docs/dev/"]

[features]
default = []
# Opus playback, via libopus. Off by default because building libopus needs
# cmake, which nothing else here requires. Without it playr reports Opus files
# as undecodable and moves on, exactly as it does for WMA or DSD.
# Enable with: cargo build --features opus
opus = ["playr-core/opus"]

[dependencies]
playr-core.workspace = true
playr-app.workspace = true
ratatui = "0.30.2"
rusqlite.workspace = true
walkdir.workspace = true
# Already built for ratatui; used to size columns in terminal cells.
unicode-width = "0.2.2"
# Command-line parsing, with help for each subcommand.
clap = { version = "4.6", features = ["derive"] }
# `playr search --json`.
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
# The fake audio device in playr-core's test helpers, which the app tests share.
cpal.workspace = true
rtrb.workspace = true

[profile.release]
opt-level = 3
lto = true
