[workspace]
members = ["crates/playr-core", "crates/playr-app", "crates/playr-gui", "crates/playr-server", "crates/playr-looper", "crates/playr-dj", "crates/playr-dsp"]

[workspace.package]
version = "0.17.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/shakfu/playr"
homepage = "https://github.com/shakfu/playr"

# Versions shared by more than one crate, so the crates cannot drift apart.
[workspace.dependencies]
# Without its default features, so `--no-default-features` on a program
# leaves Opus out; see `opus` below.
playr-core = { path = "crates/playr-core", version = "0.17.0", default-features = false }
playr-app = { path = "crates/playr-app", version = "0.17.0" }
playr-looper = { path = "crates/playr-looper", version = "0.17.0" }
playr-dj = { path = "crates/playr-dj", version = "0.17.0" }
playr-dsp = { path = "crates/playr-dsp", version = "0.17.0" }
cpal = "0.18.2"
hound = "3.5"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
walkdir = "2.5.0"
rtrb = "0.4.0"
# Media keys and the now-playing panel. `use_zbus` keeps Linux pure Rust:
# the default `dbus` feature links libdbus-1, which nothing else here needs.
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["parse", "preserve_order"] }

[package]
name = "playr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A minimal TUI music player that plays local files and contacts nothing"
readme = "README.md"
keywords = ["music", "player", "tui", "audio", "flac"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = ["docs/dev/"]

[features]
default = ["opus"]
# Opus playback, via libopus, whose build needs cmake. Without it playr
# reports Opus files as undecodable and moves on, exactly as it does for WMA
# or DSD. Leave it out with: cargo build --no-default-features
opus = ["playr-core/opus"]

[dependencies]
playr-core.workspace = true
playr-app.workspace = true
ratatui = "0.30.2"
rusqlite.workspace = true
walkdir.workspace = true
# Already built for ratatui; used to size columns in terminal cells.
unicode-width = "0.2.2"
# Command-line parsing, with help for each subcommand.
clap = { version = "4.6", features = ["derive"] }
# `playr search --json`.
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
# The fake audio device in playr-core's test helpers, which the app tests share.
cpal.workspace = true
rtrb.workspace = true

# Tests run analysis and DSP over seconds of audio, which is several times
# slower unoptimised: about 25 s against 1.3 s for playr-core's analysis
# tests. Only these crates, since optimising every dependency, the window's
# included, took a cold build from about 5 to 27 minutes. opt-level 1 keeps
# debug info and assertions.
[profile.test.package.playr-core]
opt-level = 1

[profile.test.package.playr-dsp]
opt-level = 1

[profile.test.package.playr-dj]
opt-level = 1

[profile.test.package.playr-looper]
opt-level = 1

[profile.test.package.rustfft]
opt-level = 1

[profile.test.package.realfft]
opt-level = 1

[profile.test.package.num-complex]
opt-level = 1

[profile.test.package.transpose]
opt-level = 1

[profile.test.package.strength_reduce]
opt-level = 1

[profile.test.package.symphonia-core]
opt-level = 1

[profile.test.package.symphonia-format-riff]
opt-level = 1

[profile.test.package.symphonia-codec-pcm]
opt-level = 1

[profile.test.package.rubato]
opt-level = 1

[profile.release]
opt-level = 3

# The shipped binaries. Fat LTO costs about 3 minutes a rebuild against 10 s
# without it, so it is kept out of `release`.
[profile.dist]
inherits = "release"
lto = true
